services:
  dashboard:
    image: ghcr.io/axelthas/devcontainer-dashboard:latest
    ports:
      - '${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    # Optional TernDev hook. Requires SSH access for the private clone.
    # command: ["dev-bootstrap"]
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD must be set}
      HOST_HOSTNAME: ${HOSTNAME:-}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspaces}
      PRESETS_FILE: /data/presets.json
      VSCODE_SSH_HOST: ${VSCODE_SSH_HOST:-}
      # SSH_AUTH_SOCK: /tmp/ssh-agent.socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep host and container workspace paths identical for devcontainer operations.
      - ${WORKSPACE_ROOT:-/workspaces}:${WORKSPACE_ROOT:-/workspaces}:rw
      - dashboard_data:/data
      - ddash_zsh_data:/home/ddash/.zsh_data
      # SSH access (choose one or both):
      # - ${SSH_AUTH_SOCK}:/tmp/ssh-agent.socket:ro
      # - ${HOME}/.ssh:/home/ddash/.ssh:ro
      # Operator hooks run in alphabetical order:
      # - ${HOME}/my-dashboard-hooks:/docker-entrypoint.d:ro
    restart: unless-stopped

volumes:
  dashboard_data:
  ddash_zsh_data:
