name: Code Linting and Unit Tests

on:
  pull_request:
    branches: [main] # Change this if your default branch is named 'master'

jobs:
  test:
    name: Lint and Unit Tests
    # Pinned: ubuntu-latest resolves to Ubuntu 26.04, which Playwright 1.x
    # does not support yet (playwright install fails to resolve browser
    # downloads for ubuntu26.04-x64). Unpin once Playwright adds support.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser runtime for Vitest
        run: npx playwright install --only-shell chromium

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build production outputs
        run: npm run build && npm run build:server

      - name: Service gateway tests
        run: npm run test:gateway
